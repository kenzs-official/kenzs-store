<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KENZS OFFICIAL — Premium Men's Footwear</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              brown: '#8B5E3C',
              darkBrown: '#4A3319',
              lightBrown: '#C69C6D',
              cream: '#FDFBF7',
              beige: '#F4EFEA',
              black: '#121212',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #FDFBF7;
      color: #121212;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SUPABASE CLIENT CONFIGURATION ---
    // Replace these placeholder values with your Supabase Project details
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_ANON_KEY = "your-supabase-anon-key";
    
    // Fallback Mock Engine if Supabase keys aren't configured yet
    const isSupabaseConfigured = !SUPABASE_URL.includes("your-supabase-url");
    const supabase = isSupabaseConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Sample Default Data
    const INITIAL_PRODUCTS = [
      {
        id: '1',
        name: 'Chelsea Heritage Leather Boot',
        category: 'Boots',
        price: 5999,
        discount_price: 4999,
        description: 'Handcrafted full-grain leather boots designed for modern elegance and high endurance.',
        images: ['https://images.unsplash.com/photo-1638247025967-b4e38f787b76?auto=format&fit=crop&q=80&w=800'],
        sizes: [40, 41, 42, 43, 44],
        colors: ['Dark Brown', 'Black'],
        stock: 12,
        sku: 'KENZ-BT-01',
        is_featured: true,
        is_bestseller: true,
        is_new: false,
      },
      {
        id: '2',
        name: 'Monk Strap Royal Loafer',
        category: 'Loafers',
        price: 4500,
        discount_price: null,
        description: 'Sleek double monk strap crafted with premium calfskin leather for executive style.',
        images: ['https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?auto=format&fit=crop&q=80&w=800'],
        sizes: [39, 40, 41, 42, 43],
        colors: ['Warm Brown', 'Tan'],
        stock: 4,
        sku: 'KENZ-LF-02',
        is_featured: true,
        is_bestseller: false,
        is_new: true,
      },
      {
        id: '3',
        name: 'Urban Minimalist Leather Sneaker',
        category: 'Sneakers',
        price: 3800,
        discount_price: 3200,
        description: 'Clean silhouette crafted with rich Italian leather and cushioned rubber soles.',
        images: ['https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&q=80&w=800'],
        sizes: [40, 41, 42, 43, 44, 45],
        colors: ['White', 'Off-White'],
        stock: 0,
        sku: 'KENZ-SN-03',
        is_featured: false,
        is_bestseller: true,
        is_new: true,
      }
    ];

    // Main App Component
    function App() {
      const [view, setView] = useState('home'); // home, shop, product, cart, checkout, admin, orders, tracking
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [orders, setOrders] = useState([]);
      const [isAdmin, setIsAdmin] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Admin Settings State
      const [settings, setSettings] = useState({
        storeName: 'KENZS OFFICIAL',
        whatsapp: '+251911000000',
        phone: '+251911000000',
        currency: 'ETB',
        announcement: 'Pay After Delivery Nationwide • Premium Handcrafted Footwear'
      });

      // Initialize Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Load products from Supabase if configured
      useEffect(() => {
        if (isSupabaseConfigured && supabase) {
          fetchProductsFromSupabase();
        }
      }, []);

      const fetchProductsFromSupabase = async () => {
        const { data, error } = await supabase.from('products').select('*');
        if (!error && data && data.length > 0) {
          setProducts(data);
        }
      };

      // Cart Calculations
      const cartSubtotal = useMemo(() => {
        return cart.reduce((acc, item) => {
          const price = item.discount_price || item.price;
          return acc + price * item.quantity;
        }, 0);
      }, [cart]);

      // Cart Operations
      const addToCart = (product, size, color) => {
        if (product.stock <= 0) return;
        const existingIndex = cart.findIndex(
          (i) => i.id === product.id && i.selectedSize === size && i.selectedColor === color
        );
        if (existingIndex > -1) {
          const updated = [...cart];
          updated[existingIndex].quantity += 1;
          setCart(updated);
        } else {
          setCart([...cart, { ...product, selectedSize: size, selectedColor: color, quantity: 1 }]);
        }
        setView('cart');
      };

      const updateCartQty = (index, delta) => {
        const updated = [...cart];
        updated[index].quantity += delta;
        if (updated[index].quantity <= 0) {
          updated.splice(index, 1);
        }
        setCart(updated);
      };

      const toggleWishlist = (product) => {
        if (wishlist.some(p => p.id === product.id)) {
          setWishlist(wishlist.filter(p => p.id !== product.id));
        } else {
          setWishlist([...wishlist, product]);
        }
      };

      // Order Handler
      const handlePlaceOrder = (customerData) => {
        const newOrder = {
          id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
          customer: customerData,
          items: [...cart],
          total: cartSubtotal,
          status: 'New',
          date: new Date().toLocaleDateString(),
          paymentMethod: customerData.paymentMethod || 'Cash / Pay After Delivery'
        };

        // Deduct Stock
        const updatedProducts = products.map(prod => {
          const cartItem = cart.find(c => c.id === prod.id);
          if (cartItem) {
            return { ...prod, stock: Math.max(0, prod.stock - cartItem.quantity) };
          }
          return prod;
        });

        setProducts(updatedProducts);
        setOrders([newOrder, ...orders]);
        setCart([]);

        if (customerData.isWhatsApp) {
          // Generate WhatsApp Message
          let msg = `*NEW ORDER - ${newOrder.id}*\n\n`;
          msg += `*Name:* ${customerData.name}\n`;
          msg += `*Phone:* ${customerData.phone}\n`;
          msg += `*Address:* ${customerData.address}, ${customerData.city}\n\n`;
          msg += `*Items:*\n`;
          newOrder.items.forEach(item => {
            msg += `- ${item.name} (${item.selectedSize} / ${item.selectedColor}) x${item.quantity} - ${item.discount_price || item.price} ${settings.currency}\n`;
          });
          msg += `\n*Total:* ${newOrder.total} ${settings.currency}\n`;
          msg += `*Payment:* Pay After Delivery`;

          const encoded = encodeURIComponent(msg);
          window.open(`https://wa.me/${settings.whatsapp.replace('+', '')}?text=${encoded}`, '_blank');
        }

        alert(`Order Placed Successfully! Order ID: ${newOrder.id}`);
        setView('home');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Announcement Bar */}
            <div className="bg-brand-darkBrown text-brand-beige text-xs py-2 px-4 text-center tracking-wide font-medium">
              {settings.announcement}
            </div>

            {/* Navigation Header */}
            <header className="bg-brand-cream border-b border-brand-beige sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                
                {/* Brand Logo */}
                <div className="cursor-pointer" onClick={() => setView('home')}>
                  <h1 className="text-2xl tracking-widest font-serif font-bold text-brand-black">
                    KENZS <span className="text-brand-brown font-sans font-light text-xs tracking-widest block">OFFICIAL</span>
                  </h1>
                </div>

                {/* Main Navigation */}
                <nav className="hidden md:flex space-x-8 text-sm font-medium text-brand-black">
                  <button onClick={() => setView('home')} className="hover:text-brand-brown transition">Home</button>
                  <button onClick={() => { setSelectedCategory('All'); setView('shop'); }} className="hover:text-brand-brown transition">Shop All</button>
                  <button onClick={() => { setSelectedCategory('Boots'); setView('shop'); }} className="hover:text-brand-brown transition">Boots</button>
                  <button onClick={() => { setSelectedCategory('Loafers'); setView('shop'); }} className="hover:text-brand-brown transition">Loafers</button>
                  <button onClick={() => { setSelectedCategory('Sneakers'); setView('shop'); }} className="hover:text-brand-brown transition">Sneakers</button>
                </nav>

                {/* Action Icons */}
                <div className="flex items-center space-x-5 text-brand-black">
                  <button onClick={() => setView('shop')} className="hover:text-brand-brown">
                    <i data-lucide="search" className="w-5 h-5"></i>
                  </button>
                  <button onClick={() => setView('wishlist')} className="hover:text-brand-brown relative">
                    <i data-lucide="heart" className="w-5 h-5"></i>
                    {wishlist.length > 0 && (
                      <span className="absolute -top-2 -right-2 bg-brand-brown text-white text-xs w-4 h-4 rounded-full flex items-center justify-center">
                        {wishlist.length}
                      </span>
                    )}
                  </button>
                  <button onClick={() => setView('cart')} className="hover:text-brand-brown relative">
                    <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                    {cart.length > 0 && (
                      <span className="absolute -top-2 -right-2 bg-brand-darkBrown text-white text-xs w-4 h-4 rounded-full flex items-center justify-center">
                        {cart.length}
                      </span>
                    )}
                  </button>
                  <button onClick={() => setView(isAdmin ? 'admin' : 'admin-login')} className="hover:text-brand-brown text-xs bg-brand-beige py-1 px-3 rounded font-medium">
                    {isAdmin ? 'Admin Panel' : 'Admin'}
                  </button>
                </div>
              </div>
            </header>

            {/* PAGE CONTENT ROUTING */}
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
              
              {/* HOME PAGE */}
              {view === 'home' && (
                <div className="space-y-16">
                  {/* Hero Section */}
                  <div className="relative bg-brand-beige rounded-2xl overflow-hidden p-8 sm:p-16 flex flex-col md:flex-row items-center justify-between min-h-[480px]">
                    <div className="max-w-xl space-y-6 z-10">
                      <span className="text-xs font-semibold tracking-widest text-brand-brown uppercase">Exclusive Collection</span>
                      <h2 className="text-4xl sm:text-6xl font-serif font-bold text-brand-black leading-tight">
                        Walk With Confidence.
                      </h2>
                      <p className="text-gray-600 text-base sm:text-lg">
                        Premium men's footwear designed for every step. Modern craft meets unmatched luxury comfort.
                      </p>
                      <div className="flex space-x-4 pt-2">
                        <button onClick={() => setView('shop')} className="bg-brand-black text-white px-8 py-3.5 rounded-none font-medium hover:bg-brand-brown transition">
                          Shop Now
                        </button>
                        <button onClick={() => setView('shop')} className="border border-brand-black text-brand-black px-8 py-3.5 rounded-none font-medium hover:bg-brand-black hover:text-white transition">
                          Explore Collection
                        </button>
                      </div>
                    </div>
                    <div className="mt-8 md:mt-0 w-full md:w-1/2 flex justify-center">
                      <img 
                        src="https://images.unsplash.com/photo-1638247025967-b4e38f787b76?auto=format&fit=crop&q=80&w=800" 
                        alt="Hero Shoe" 
                        className="rounded-xl shadow-2xl object-cover max-h-[380px] w-full"
                      />
                    </div>
                  </div>

                  {/* Trust Highlights */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-6 py-6 border-y border-brand-beige text-center">
                    <div>
                      <h4 className="font-semibold text-brand-black text-sm">Pay After Delivery</h4>
                      <p className="text-xs text-gray-500 mt-1">Inspect product before payment</p>
                    </div>
                    <div>
                      <h4 className="font-semibold text-brand-black text-sm">Quality Guaranteed</h4>
                      <p className="text-xs text-gray-500 mt-1">Handcrafted premium leather</p>
                    </div>
                    <div>
                      <h4 className="font-semibold text-brand-black text-sm">Fast Dispatch</h4>
                      <p className="text-xs text-gray-500 mt-1">Swift delivery nationwide</p>
                    </div>
                    <div>
                      <h4 className="font-semibold text-brand-black text-sm">Secure Ordering</h4>
                      <p className="text-xs text-gray-500 mt-1">Easy WhatsApp or Web Checkout</p>
                    </div>
                  </div>

                  {/* Featured Collection */}
                  <div>
                    <div className="flex justify-between items-end mb-8">
                      <div>
                        <h3 className="text-2xl font-serif font-bold text-brand-black">Featured Products</h3>
                        <p className="text-sm text-gray-500 mt-1">Curated selection for the modern gentleman</p>
                      </div>
                      <button onClick={() => setView('shop')} className="text-brand-brown text-sm font-semibold hover:underline">View All →</button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                      {products.filter(p => p.is_featured).map(product => (
                        <ProductCard 
                          key={product.id} 
                          product={product} 
                          onSelect={(p) => { setSelectedProduct(p); setView('product'); }}
                          currency={settings.currency}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* SHOP PAGE */}
              {view === 'shop' && (
                <div>
                  <div className="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div>
                      <h2 className="text-3xl font-serif font-bold text-brand-black">All Footwear</h2>
                      <p className="text-sm text-gray-500">Showing collection</p>
                    </div>

                    {/* Filters */}
                    <div className="flex flex-wrap gap-3 w-full md:w-auto">
                      <input 
                        type="text" 
                        placeholder="Search products..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="border border-gray-300 px-4 py-2 text-sm rounded bg-white focus:outline-none focus:border-brand-brown flex-1"
                      />
                      <select 
                        value={selectedCategory} 
                        onChange={(e) => setSelectedCategory(e.target.value)}
                        className="border border-gray-300 px-4 py-2 text-sm rounded bg-white focus:outline-none"
                      >
                        <option value="All">All Categories</option>
                        <option value="Boots">Boots</option>
                        <option value="Loafers">Loafers</option>
                        <option value="Sneakers">Sneakers</option>
                        <option value="Leather Shoes">Leather Shoes</option>
                      </select>
                    </div>
                  </div>

                  {/* Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    {products
                      .filter(p => selectedCategory === 'All' || p.category === selectedCategory)
                      .filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()))
                      .map(product => (
                        <ProductCard 
                          key={product.id} 
                          product={product} 
                          onSelect={(p) => { setSelectedProduct(p); setView('product'); }}
                          currency={settings.currency}
                        />
                      ))}
                  </div>
                </div>
              )}

              {/* PRODUCT DETAILS PAGE */}
              {view === 'product' && selectedProduct && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-12 py-6">
                  {/* Image Gallery */}
                  <div>
                    <img 
                      src={selectedProduct.images[0]} 
                      alt={selectedProduct.name} 
                      className="w-full h-[450px] object-cover rounded-xl shadow-md"
                    />
                  </div>

                  {/* Product Info */}
                  <div className="space-y-6">
                    <div>
                      <span className="text-xs font-semibold text-brand-brown uppercase">{selectedProduct.category}</span>
                      <h2 className="text-3xl font-serif font-bold text-brand-black mt-1">{selectedProduct.name}</h2>
                      <div className="mt-3 flex items-baseline space-x-3">
                        {selectedProduct.discount_price ? (
                          <>
                            <span className="text-2xl font-bold text-brand-black">{selectedProduct.discount_price} {settings.currency}</span>
                            <span className="text-lg text-gray-400 line-through">{selectedProduct.price} {settings.currency}</span>
                          </>
                        ) : (
                          <span className="text-2xl font-bold text-brand-black">{selectedProduct.price} {settings.currency}</span>
                        )}
                      </div>
                    </div>

                    <p className="text-gray-600 text-sm leading-relaxed">{selectedProduct.description}</p>

                    {/* Stock status */}
                    <div>
                      {selectedProduct.stock > 3 ? (
                        <span className="inline-block bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded font-medium">In Stock</span>
                      ) : selectedProduct.stock > 0 ? (
                        <span className="inline-block bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded font-medium">LOW STOCK ({selectedProduct.stock} Left)</span>
                      ) : (
                        <span className="inline-block bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded font-medium">SOLD OUT</span>
                      )}
                    </div>

                    {/* Sizes Selection */}
                    <div>
                      <label className="text-xs font-bold text-brand-black uppercase block mb-2">Select Shoe Size (EU)</label>
                      <div className="flex flex-wrap gap-2">
                        {selectedProduct.sizes.map((size) => (
                          <button key={size} className="border border-gray-300 hover:border-brand-black px-4 py-2 text-sm font-medium rounded transition focus:bg-brand-black focus:text-white">
                            {size}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Actions */}
                    <div className="space-y-3 pt-4">
                      <button 
                        disabled={selectedProduct.stock <= 0}
                        onClick={() => addToCart(selectedProduct, selectedProduct.sizes[0], selectedProduct.colors[0])}
                        className={`w-full py-4 rounded font-medium text-sm transition ${selectedProduct.stock > 0 ? 'bg-brand-black text-white hover:bg-brand-brown' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                      >
                        {selectedProduct.stock > 0 ? 'Add To Cart' : 'Sold Out'}
                      </button>
                      <p className="text-xs text-center text-gray-500">Pay cash upon delivery nationwide</p>
                    </div>
                  </div>
                </div>
              )}

              {/* CART PAGE */}
              {view === 'cart' && (
                <div className="max-w-4xl mx-auto space-y-8">
                  <h2 className="text-3xl font-serif font-bold text-brand-black">Your Shopping Cart</h2>

                  {cart.length === 0 ? (
                    <div className="text-center py-16 bg-brand-beige rounded-xl">
                      <p className="text-gray-500">Your shopping cart is empty.</p>
                      <button onClick={() => setView('shop')} className="mt-4 bg-brand-black text-white px-6 py-2 text-sm font-medium">Explore Products</button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                      <div className="md:col-span-2 space-y-4">
                        {cart.map((item, index) => (
                          <div key={index} className="flex items-center justify-between border-b border-gray-200 py-4 bg-white p-4 rounded shadow-sm">
                            <div className="flex items-center space-x-4">
                              <img src={item.images[0]} className="w-16 h-16 object-cover rounded" />
                              <div>
                                <h4 className="font-bold text-sm text-brand-black">{item.name}</h4>
                                <p className="text-xs text-gray-500">Size: {item.selectedSize} | Color: {item.selectedColor}</p>
                                <span className="text-sm font-semibold">{item.discount_price || item.price} {settings.currency}</span>
                              </div>
                            </div>
                            <div className="flex items-center space-x-3">
                              <button onClick={() => updateCartQty(index, -1)} className="border px-2 py-1 text-xs">-</button>
                              <span className="text-sm font-semibold">{item.quantity}</span>
                              <button onClick={() => updateCartQty(index, 1)} className="border px-2 py-1 text-xs">+</button>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Summary */}
                      <div className="bg-brand-beige p-6 rounded-xl space-y-4 h-fit">
                        <h3 className="font-bold text-lg text-brand-black">Order Summary</h3>
                        <div className="flex justify-between text-sm">
                          <span>Subtotal</span>
                          <span className="font-bold">{cartSubtotal} {settings.currency}</span>
                        </div>
                        <div className="flex justify-between text-sm">
                          <span>Delivery</span>
                          <span className="text-green-700 font-semibold">Pay After Delivery</span>
                        </div>
                        <div className="border-t border-gray-300 pt-3 flex justify-between font-bold text-base">
                          <span>Total</span>
                          <span>{cartSubtotal} {settings.currency}</span>
                        </div>
                        <button onClick={() => setView('checkout')} className="w-full bg-brand-black text-white py-3 font-medium text-sm hover:bg-brand-brown transition">
                          Proceed To Checkout
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* CHECKOUT PAGE */}
              {view === 'checkout' && (
                <div className="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                  <h2 className="text-2xl font-serif font-bold text-brand-black mb-6">Complete Order</h2>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handlePlaceOrder({
                      name: formData.get('name'),
                      phone: formData.get('phone'),
                      city: formData.get('city'),
                      address: formData.get('address'),
                      isWhatsApp: formData.get('checkoutType') === 'whatsapp'
                    });
                  }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Full Name</label>
                      <input required name="name" type="text" className="w-full border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-brand-brown" />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase mb-1">Phone Number</label>
                        <input required name="phone" type="tel" className="w-full border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-brand-brown" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase mb-1">City</label>
                        <input required name="city" type="text" defaultValue="Addis Ababa" className="w-full border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-brand-brown" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Delivery Address</label>
                      <textarea required name="address" rows="2" className="w-full border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-brand-brown"></textarea>
                    </div>

                    <div className="pt-4 border-t border-gray-200">
                      <label className="block text-xs font-bold uppercase mb-2">Method of Checkout</label>
                      <div className="space-y-2">
                        <label className="flex items-center space-x-3 p-3 border rounded cursor-pointer hover:bg-brand-beige">
                          <input type="radio" name="checkoutType" value="standard" defaultChecked />
                          <span className="text-sm font-medium">Standard Web Checkout (Pay Cash After Delivery)</span>
                        </label>
                        <label className="flex items-center space-x-3 p-3 border rounded cursor-pointer hover:bg-brand-beige">
                          <input type="radio" name="checkoutType" value="whatsapp" />
                          <span className="text-sm font-medium">Order Direct via WhatsApp</span>
                        </label>
                      </div>
                    </div>

                    <button type="submit" className="w-full bg-brand-brown text-white py-4 font-bold rounded hover:bg-brand-darkBrown transition mt-6">
                      Confirm Order ({cartSubtotal} {settings.currency})
                    </button>
                  </form>
                </div>
              )}

              {/* ADMIN LOGIN */}
              {view === 'admin-login' && (
                <div className="max-w-md mx-auto bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                  <h2 className="text-2xl font-serif font-bold text-center mb-6">Admin Portal</h2>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    setIsAdmin(true);
                    setView('admin');
                  }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Email</label>
                      <input type="email" required defaultValue="admin@kenzs.com" className="w-full border p-3 text-sm rounded" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Password</label>
                      <input type="password" required defaultValue="password" className="w-full border p-3 text-sm rounded" />
                    </div>
                    <button type="submit" className="w-full bg-brand-black text-white py-3 rounded font-semibold text-sm">
                      Login to Dashboard
                    </button>
                  </form>
                </div>
              )}

              {/* ADMIN DASHBOARD */}
              {view === 'admin' && isAdmin && (
                <div className="space-y-8">
                  <div className="flex justify-between items-center border-b pb-4">
                    <div>
                      <h2 className="text-2xl font-bold font-serif">Store Dashboard</h2>
                      <p className="text-xs text-gray-500">Manage Products, Orders & Inventory</p>
                    </div>
                    <button onClick={() => setIsAdmin(false)} className="text-xs text-red-600 font-semibold border border-red-200 px-3 py-1.5 rounded">
                      Log Out
                    </button>
                  </div>

                  {/* Metrics */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div className="bg-white p-4 rounded border shadow-sm">
                      <span className="text-xs text-gray-400 uppercase font-bold">Total Products</span>
                      <p className="text-2xl font-bold mt-1">{products.length}</p>
                    </div>
                    <div className="bg-white p-4 rounded border shadow-sm">
                      <span className="text-xs text-gray-400 uppercase font-bold">Total Orders</span>
                      <p className="text-2xl font-bold mt-1">{orders.length}</p>
                    </div>
                    <div className="bg-white p-4 rounded border shadow-sm">
                      <span className="text-xs text-gray-400 uppercase font-bold">Low Stock</span>
                      <p className="text-2xl font-bold text-amber-600 mt-1">{products.filter(p => p.stock > 0 && p.stock <= 4).length}</p>
                    </div>
                    <div className="bg-white p-4 rounded border shadow-sm">
                      <span className="text-xs text-gray-400 uppercase font-bold">Sold Out</span>
                      <p className="text-2xl font-bold text-red-600 mt-1">{products.filter(p => p.stock === 0).length}</p>
                    </div>
                  </div>

                  {/* Orders Management Table */}
                  <div className="bg-white p-6 rounded border shadow-sm space-y-4">
                    <h3 className="font-bold text-lg">Customer Orders</h3>
                    {orders.length === 0 ? (
                      <p className="text-xs text-gray-500">No orders received yet.</p>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                          <thead>
                            <tr className="border-b bg-gray-50 text-xs uppercase font-bold text-gray-500">
                              <th className="p-3">Order ID</th>
                              <th className="p-3">Customer</th>
                              <th className="p-3">Total</th>
                              <th className="p-3">Status</th>
                            </tr>
                          </thead>
                          <tbody>
                            {orders.map((o) => (
                              <tr key={o.id} className="border-b">
                                <td className="p-3 font-semibold">{o.id}</td>
                                <td className="p-3">{o.customer.name} ({o.customer.phone})</td>
                                <td className="p-3">{o.total} {settings.currency}</td>
                                <td className="p-3">
                                  <span className="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded font-semibold">{o.status}</span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* Footer */}
          <footer className="bg-brand-black text-brand-beige py-12 mt-20 border-t border-brand-darkBrown">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
              <div>
                <h3 className="font-serif text-xl font-bold tracking-widest text-white">KENZS OFFICIAL</h3>
                <p className="text-xs text-gray-400 mt-2 leading-relaxed">
                  Crafting modern excellence in men's footwear. High quality leather shoes, boots, and sneakers designed for confidence.
                </p>
              </div>
              <div>
                <h4 className="font-semibold text-sm text-white mb-3">Customer Support</h4>
                <p className="text-xs text-gray-400">Phone: {settings.phone}</p>
                <p className="text-xs text-gray-400 mt-1">WhatsApp: {settings.whatsapp}</p>
                <p className="text-xs text-gray-400 mt-1">Pay After Delivery Available</p>
              </div>
              <div>
                <h4 className="font-semibold text-sm text-white mb-3">Brand Promise</h4>
                <p className="text-xs text-gray-400 leading-relaxed">
                  Every pair is checked for craftsmanship before dispatch. Modern aesthetics tailored for high distinction.
                </p>
              </div>
            </div>
            <div className="text-center text-xs text-gray-600 mt-12 border-t border-gray-900 pt-6">
              © 2026 KENZS OFFICIAL. All rights reserved.
            </div>
          </footer>
        </div>
      );
    }

    // Reusable Product Card Component
    function ProductCard({ product, onSelect, currency }) {
      return (
        <div 
          onClick={() => onSelect(product)} 
          className="group cursor-pointer bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition"
        >
          <div className="relative overflow-hidden bg-gray-100 h-64">
            <img 
              src={product.images[0]} 
              alt={product.name} 
              className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
            />
            {product.stock === 0 && (
              <span className="absolute top-3 left-3 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded tracking-wider uppercase">
                Sold Out
              </span>
            )}
            {product.discount_price && product.stock > 0 && (
              <span className="absolute top-3 left-3 bg-brand-brown text-white text-[10px] font-bold px-2 py-1 rounded tracking-wider uppercase">
                Sale
              </span>
            )}
          </div>
          <div className="p-5">
            <span className="text-[10px] font-bold uppercase tracking-widest text-brand-brown">{product.category}</span>
            <h3 className="font-semibold text-brand-black text-base mt-1 group-hover:text-brand-brown transition truncate">{product.name}</h3>
            <div className="mt-2 flex items-baseline space-x-2">
              {product.discount_price ? (
                <>
                  <span className="font-bold text-brand-black text-sm">{product.discount_price} {currency}</span>
                  <span className="text-xs text-gray-400 line-through">{product.price} {currency}</span>
                </>
              ) : (
                <span className="font-bold text-brand-black text-sm">{product.price} {currency}</span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
